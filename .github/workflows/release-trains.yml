name: Release Trains

# ── Promotion ladder: feature/* → nightly → weekly → main (stable) ───────────
# This workflow is the engine that makes the `nightly` and `weekly` branches
# *mean* something: it builds the head of each train on a schedule and (when
# signing secrets are configured) ships it to TestFlight.
#
# IMPORTANT — why this file must live on `main`:
#   GitHub only runs `schedule` (and `workflow_dispatch`) using the workflow
#   file as it exists on the repository's DEFAULT branch. So the cron triggers
#   below fire from `main`, and each run then *checks out* the train branch it
#   was asked to build. The `nightly` / `weekly` branches do not need their own
#   copy of this file for the schedule to work.
#
# Required repository secrets for the TestFlight upload step (Settings ▸
# Secrets and variables ▸ Actions). Until these exist, runs still compile the
# train branch and simply skip the upload — no red-X nightlies:
#   APP_STORE_CONNECT_API_KEY_JSON  Full contents of fastlane/api_key.json
#                                   (key_id / issuer_id / key / in_house).
#   MATCH_PASSWORD                  Passphrase for the fastlane match repo.
#   MATCH_GIT_SSH_KEY               Private deploy key with READ access to the
#                                   certificates repo in fastlane/Matchfile
#                                   (git@github.com:dfakkeldy/echo-audiobooks-certificates).

on:
  schedule:
    # Times are UTC. GitHub cron is best-effort (may lag at peak) and only runs
    # on the default branch; it is also auto-paused after 60 days of repo
    # inactivity (a manual run or any push re-arms it). Halifax is UTC-3 during
    # daylight time and UTC-4 during standard time, so both UTC candidates are
    # listed; the resolver job skips whichever candidate is inactive.
    #
    # Fire time is 05:20 America/Halifax — deliberately early. The build is not
    # ready when the cron *fires*; it is ready after GitHub's scheduled-run lag +
    # the scarce macOS-runner queue + a 40–60 min archive/upload/Apple-processing
    # run. The old 09:30 slot (12:30 UTC ≈ 08:30 US-Eastern) hit peak CI demand
    # and routinely landed builds early afternoon. 08:20 UTC is a low-demand
    # overnight-Americas window, so even a bad queue day finishes well before 9am.
    # The odd :20 minute avoids the :00/:30 cron herd.
    # One cron per channel, in UTC. GitHub Actions cron never observes DST, so
    # 08:20 UTC is 05:20 America/Halifax during ADT and 04:20 during AST. A
    # nightly/weekly TestFlight build does not care about that one-hour drift.
    # We deliberately do NOT add a second DST "companion" per channel: the
    # companion only ever skipped, and a skipped ship job reports the whole run
    # as success — a green check that built and shipped nothing, which hides
    # real ship failures instead of surfacing them.
    - cron: '20 8 * * *'  # Nightly — every day, 05:20 ADT / 04:20 AST
    - cron: '20 8 * * 1'  # Weekly  — Mondays
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which train to build & ship'
        type: choice
        options: [nightly, weekly]
        default: nightly

# Don't pile up overlapping builds of the same channel, but never cancel an
# in-flight upload (an interrupted TestFlight submission is messy to recover).
concurrency:
  group: release-trains-${{ github.event.inputs.channel || github.event.schedule }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release train
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.train.outputs.channel }}
      branch: ${{ steps.train.outputs.branch }}
    steps:
      # ── Map the trigger to a channel/branch ───────────────────────────────
      # Scheduled runs identify themselves by their cron string; manual runs by
      # the `channel` input. Channel name == branch name by design. There is no
      # inactive/skip outcome any more: every scheduled run and every dispatch
      # ships, so the run's conclusion means exactly what it says.
      - name: Resolve channel → branch
        id: train
        shell: bash
        run: |
          schedule="${{ github.event.schedule }}"
          input_channel="${{ github.event.inputs.channel }}"

          case "$schedule" in
            "20 8 * * *") CH=nightly ;;
            "20 8 * * 1") CH=weekly ;;
            *)            CH="${input_channel:-nightly}" ;;
          esac

          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "branch=$CH" >> "$GITHUB_OUTPUT"
          echo "Resolved '$CH' train from branch '$CH'."

  ship:
    needs: resolve
    name: Build & ship train
    # MUST stay on the same runner image as the ci.yml build gate that vetted
    # the branch this job checks out (`nightly` runs on macos-26). `setup-xcode`
    # with `xcode-version: '26'` resolves to the newest 26.x *installed on the
    # image*, and the images differ: macos-15 tops out at Xcode 26.3 while
    # macos-26 ships 26.6. That skew meant a commit could pass "Build gate +
    # tests" on its PR and still fail this job's identical `build-for-testing`,
    # which is how nightly went dark 2026-07-25 → 07-31: first a Swift-Testing
    # `#expect` that exceeded 26.3's constraint-solver budget (#481), then
    # `SystemLanguageModel.contextSize`, a Foundation Models member that simply
    # does not exist in 26.3's SDK. If ci.yml's runner moves, move this with it.
    runs-on: macos-26
    # Fail fast on a hang (e.g. a headless codesign keychain prompt) instead of
    # silently burning the 6-hour default. A real run is archive + upload + Apple
    # processing ≈ 40–60 min, so 90 leaves headroom without masking a stall.
    timeout-minutes: 90

    env:
      # Surfaced as env so the credential check below can test for them; empty
      # strings when the secrets are not configured.
      ASC_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
      # match reads its repo URL from fastlane/Matchfile; readonly is forced via
      # `readonly: is_ci` in the Fastfile so CI never mutates signing assets.
      # Generic, not a named device. This job only ever COMPILES (build-for-
      # testing); it never boots a simulator or runs a test, so pinning a device
      # name buys nothing and breaks whenever a runner image drops that model —
      # macos-26 carries a different simulator set than macos-15 did.
      IOS_DESTINATION: "generic/platform=iOS Simulator"

    steps:
      - name: Checkout ${{ needs.resolve.outputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          # Full history + all branches so the nightly "What to Test" generator
          # can resolve origin/weekly and compute merge-base(origin/weekly, HEAD).
          # The default shallow single-branch clone has no origin/weekly ref, which
          # would silently no-op the auto-draft (it falls back to the committed copy).
          fetch-depth: 0

      # Pin Xcode 26.x to match ci.yml (newest installed 26.x; never a future
      # major). This resolves per runner image, so it only agrees with ci.yml
      # while both jobs run on the same image — see the `runs-on` note above.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode26-spm-${{ hashFiles('**/Package.resolved', 'Echo.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-spm-

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Echo.xcodeproj -scheme Echo

      # ── Always-on gate: compile the train branch (no secrets required) ─────
      # This is the guaranteed-useful part of a scheduled run and the same gate
      # ci.yml applies to pushes/PRs. It fails fast and clearly on a train that
      # someone promoted in a non-compiling state.
      - name: Build gate — Echo (iOS app + widget + watch + tests)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination "$IOS_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # ── Can we actually ship, or only validate? ───────────────────────────
      - name: Check release credentials
        id: creds
        run: |
          if [ -n "$ASC_API_KEY_JSON" ] && [ -n "$MATCH_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight upload skipped::Signing secrets not configured (APP_STORE_CONNECT_API_KEY_JSON / MATCH_PASSWORD). The ${{ needs.resolve.outputs.channel }} branch was compiled but not uploaded."
          fi

      - name: Load match deploy key
        if: steps.creds.outputs.ready == 'true' && env.MATCH_GIT_SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY }}

      - name: Write App Store Connect API key
        if: steps.creds.outputs.ready == 'true'
        run: printf '%s' "$ASC_API_KEY_JSON" > fastlane/api_key.json

      # Pin a modern, OpenSSL-linked Ruby (read from .ruby-version) instead of
      # relying on whatever the macos-15 runner happens to ship. This keeps CI
      # deterministic and on the same Ruby as local dev. `bundler-cache: true`
      # runs `bundle install` and caches the gems. (Note: the LibreSSL match
      # encryption bug that bites macOS *system* Ruby 2.6 does not occur here —
      # this Ruby links real OpenSSL.)
      - name: Set up Ruby
        if: steps.creds.outputs.ready == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The `beta` lane archives iOS (+ embedded watch & widget) and macOS, then
      # uploads every binary to TestFlight using fastlane/testflight/*.txt for
      # the "What to Test" copy. Tip: route the Nightly and Weekly builds to
      # separate TestFlight tester groups so testers self-select their risk.
      - name: Upload ${{ needs.resolve.outputs.channel }} build to TestFlight
        if: steps.creds.outputs.ready == 'true'
        run: bundle exec fastlane beta channel:${{ needs.resolve.outputs.channel }}
